[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
sentinel-core = { path = "../../../crates/sentinel-core" }
sentinel-product-dto = { path = "../../../crates/sentinel-product-dto" }
sentinel-product-service = { path = "../../../crates/sentinel-product-service" }
sentinel-rules = { path = "../../../crates/sentinel-rules" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
