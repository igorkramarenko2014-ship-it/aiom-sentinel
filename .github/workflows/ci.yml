name: phase1-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Check verifier syntax
        run: |
          node --check tools/verify-evidence.mjs
          node --check tools/verify-architecture.mjs
          node --check tools/verify-portability.mjs
      - name: Verify evidence contract
        run: |
          cargo run -p sentinel-cli -- scan tests/fixtures/harmless-negative.txt --output evidence.json
          node tools/verify-evidence.mjs evidence.json
      - name: Verify architecture pack
        run: |
          node tools/verify-architecture.mjs
          node tools/verify-portability.mjs
      - name: Check diff whitespace
        run: git diff --check
