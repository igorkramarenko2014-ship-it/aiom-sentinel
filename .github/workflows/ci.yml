name: portfolio-verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-features --locked
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Lint product service strictly
        run: cargo clippy -p sentinel-product-service --all-targets --locked -- -D warnings
      - name: Verify harmless portfolio demo
        run: ./scripts/verify-demo.sh
      - name: Check verifier syntax
        run: |
          node --check tools/verify-evidence.mjs
          node --check tools/verify-architecture.mjs
          node --check tools/verify-portability.mjs
      - name: Verify evidence contract
        run: |
          cargo run -p sentinel-cli --locked -- scan tests/fixtures/harmless-negative.txt --output evidence.json
          node tools/verify-evidence.mjs evidence.json
      - name: Verify architecture pack
        run: |
          node tools/verify-architecture.mjs
          node tools/verify-portability.mjs
      - name: Check diff whitespace
        run: git diff --check
