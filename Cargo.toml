[workspace]
members = [
  "crates/sentinel-core",
  "crates/sentinel-hash",
  "crates/sentinel-pe",
  "crates/sentinel-rules",
  "crates/sentinel-evidence",
  "crates/sentinel-scanner",
  "crates/sentinel-cli",
  "crates/sentinel-product-dto",
  "crates/sentinel-product-service",
  "tests",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
arc-swap = "=1.9.2"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive"] }
digest = "0.10.7"
ed25519-dalek = "=3.0.0"
hex = "0.4.3"
md-5 = "0.10.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
uuid = { version = "1.19.0", features = ["v4", "v5", "serde"] }
criterion = "0.5.1"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
tar = "0.4.43"
flate2 = "1.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
